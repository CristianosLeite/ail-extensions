# Every test of the repository, for a pull request to main: make test
# with the command ail of the release of AIL that Ailfile asks for, and
# make check, which compares the editors with the sources of that
# version of AIL, fetched by tools/check.sh, and needs a VS Code.
name: test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # the release of AIL that the line "ail" of Ailfile asks for
      - name: install AIL
        run: |
          v=$(sed -n 's/^ail //p' Ailfile)
          a=ail-$v-x86_64-linux
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/CristianosLeite/ail/releases/download/v$v/$a.tar.gz"
          curl -fsSLO "https://github.com/CristianosLeite/ail/releases/download/v$v/$a.tar.gz.sha256"
          sha256sum -c "$a.tar.gz.sha256"
          tar -xzf "$a.tar.gz"
          echo "$RUNNER_TEMP/$a/bin" >> "$GITHUB_PATH"
      - run: make test

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # the editor is only run as a library, without a window
      - name: fetch VS Code
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o code.tar.gz https://update.code.visualstudio.com/latest/linux-x64/stable
          tar -xzf code.tar.gz
          echo "CODE=$RUNNER_TEMP/VSCode-linux-x64/code" >> "$GITHUB_ENV"
      - run: make check
